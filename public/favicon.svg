<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#140f2d" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" stroke="#ffffff" stroke-width="16" />

  <!-- Code Graphic < / > -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowEffect)">
    <!-- Left Bracket < -->
    <path d="M 175 195 L 115 256 L 175 317" stroke-width="38" />
    <!-- Right Bracket > -->
    <path d="M 337 195 L 397 256 L 337 317" stroke-width="38" />
    <!-- Center Slash / -->
    <path d="M 285 165 L 227 347" stroke-width="38" />
  </g>
</svg>